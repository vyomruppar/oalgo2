[project]
name = "oalgo2-backend"
version = "0.1.0"
description = "Quantitative stock research platform (research and paper trading only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography==50.0.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# Optional local sentiment model (FinBERT). Install with: uv sync --group ai
ai = ["torch>=2.4", "transformers>=4.44"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
